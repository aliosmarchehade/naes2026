{% extends "website/modelo.html" %}

{% block conteudo %}

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-3">
        <h2>Países</h2>

        <a href="{% url 'pais-create' %}"
           class="btn btn-success">
            Novo País
        </a>
    </div>

    <table class="table table-dark table-hover">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Sigla</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            {% for pais in object_list %}

            <tr>

                <td>

                    <img src="https://flagsapi.com/{{ pais.sigla }}/flat/32.png"
                         width="32"
                         class="me-2">
                
                    {{ pais.nome }}
                
                </td>

                <td>{{ pais.sigla }}</td>

                <td>

                    <a href="{% url 'pais-update' pais.pk %}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <a href="{% url 'pais-delete' pais.pk %}"
                       class="btn btn-danger btn-sm">
                        Excluir
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="3">
                    Nenhum país cadastrado.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
